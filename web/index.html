<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>AI 热点雷达</title>
    <!--
      图标写成内联 data URI，不引单独的文件。
      不写这一行浏览器会隐式去要 `/favicon.ico`，dev server 上永远 404——
      每次加载都在控制台留一条红字，把真正的错误淹掉。
      图样与 `AppHeader` 的 logo 一致：青渐变底 + 白色雷达。
      渐变的两个色值就是 `--color-accent-soft` 与 `--color-accent`，
      和 styles.css 一起改，别只改一边（上一版这里留的是 blue-500）。
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2322d3ee'/%3E%3Cstop offset='1' stop-color='%2306b6d4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='7' fill='url(%23g)'/%3E%3Cg fill='none' stroke='%23fff' stroke-width='2' stroke-linecap='round'%3E%3Ccircle cx='16' cy='16' r='8'/%3E%3Cpath d='M16 16 L22.5 9.5'/%3E%3C/g%3E%3Ccircle cx='16' cy='16' r='2.4' fill='%23fff'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
